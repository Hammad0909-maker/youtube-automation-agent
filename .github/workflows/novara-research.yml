name: NOVARA YouTube Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: Fetch public YouTube research
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run TubeAlfred research
        env:
          TUBEALFRED_API_KEY: ${{ secrets.TUBEALFRED_API_KEY }}
        run: node scripts/novara/research-trends.js

      - name: Save report for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novara-youtube-research
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
