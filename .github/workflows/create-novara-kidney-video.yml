name: Create NOVARA Kidney Warning Signs Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak python3-pil python3-numpy
      - name: Render the kidney explainer
        run: |
          python3 scripts/free-video-editor/create_novara_kidney_video.py \
            --output rendered/novara-kidney-warning-signs.mp4 \
            --workdir rendered/assets
      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: novara-kidney-warning-signs-video
          path: rendered/novara-kidney-warning-signs.mp4
          if-no-files-found: error
          retention-days: 7
